<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0f10" />
    <script>
      // Applies the stored theme before first paint, as next-themes does (src/components/theme-provider.tsx).
      try {
        var theme = localStorage.getItem("exposurenexus-theme");
        var dark =
          theme === "dark" ||
          (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(dark ? "dark" : "light");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (error) {}
    </script>
    <meta
      name="description"
      content="ExposureNexus is an open-source CTEM platform for collecting, normalizing, triaging, and tracking security findings."
    />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>ExposureNexus</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
