name: CI
permissions:
  contents: read

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  container-build:
    name: Container Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify docker image builds
        env:
          IMAGE_TAG: exposurenexus:ci
        run: sh scripts/verify-container-build.sh

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run shared contract tests
        run: pnpm test:contracts

      - name: Run API unit tests
        run: pnpm test:api

      - name: Install Playwright Chromium
        run: pnpm --filter @exposurenexus/ui exec playwright install --with-deps chromium

      - name: Run UI tests
        run: pnpm test:ui

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API coverage
        run: pnpm coverage:api

      - name: Run shared contracts coverage
        run: pnpm coverage:contracts

      - name: Install Playwright Chromium
        run: pnpm --filter @exposurenexus/ui exec playwright install --with-deps chromium

      - name: Run UI coverage
        run: pnpm coverage:ui

      - name: Upload API coverage
        if: ${{ env.ACT != 'true' }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          disable_search: true
          files: apps/api/coverage/lcov.info
          flags: api
          fail_ci_if_error: false

      - name: Upload UI coverage
        if: ${{ env.ACT != 'true' }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          disable_search: true
          files: apps/ui/coverage/lcov.info
          flags: ui
          fail_ci_if_error: false

      - name: Upload shared contracts coverage
        if: ${{ env.ACT != 'true' }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          disable_search: true
          files: packages/contracts/coverage/lcov.info
          flags: contracts
          fail_ci_if_error: false

  publish-container:
    name: Publish Container
    runs-on: ubuntu-latest
    needs:
      - lint
      - build
      - container-build
      - test
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/s-schoen/exposurenexus
          tags: |
            type=edge,branch=master
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
