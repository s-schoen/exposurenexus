name: CI
permissions:
  contents: read

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  container-build:
    name: Container Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify docker image builds
        env:
          IMAGE_TAG: exposurenexus:ci
        run: sh scripts/verify-container-build.sh

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API unit tests
        run: pnpm test:api

      - name: Install Playwright Chromium
        run: pnpm --filter @exposurenexus/ui exec playwright install --with-deps chromium

      - name: Run UI tests
        run: pnpm test:ui

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API coverage
        run: pnpm coverage:api

      - name: Install Playwright Chromium
        run: pnpm --filter @exposurenexus/ui exec playwright install --with-deps chromium

      - name: Run UI coverage
        run: pnpm coverage:ui

      - name: Upload API coverage
        uses: codecov/codecov-action@v6
        with:
          use_oidc: true
          disable_search: true
          files: apps/api/coverage/lcov.info
          flags: api
          fail_ci_if_error: false

      - name: Upload UI coverage
        uses: codecov/codecov-action@v6
        with:
          use_oidc: true
          disable_search: true
          files: apps/ui/coverage/lcov.info
          flags: ui
          fail_ci_if_error: false
