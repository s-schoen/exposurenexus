codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes
    after_n_builds: 5

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: auto
        threshold: 2%
        only_pulls: true
        informational: true
        if_ci_failed: error
    patch:
      default:
        target: 80%
        threshold: 5%
        only_pulls: true
        if_ci_failed: error

flags:
  api:
    paths:
      - apps/api/src/
    carryforward: false
  ui:
    paths:
      - apps/ui/src/
    carryforward: false
  contracts:
    paths:
      - packages/contracts/src/
    carryforward: false
  jobs:
    paths:
      - packages/jobs/src/
    carryforward: false
  backend:
    paths:
      - packages/backend/src/
    carryforward: false

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        threshold: 2%
        informational: true
  individual_components:
    - component_id: api
      name: API
      paths:
        - apps/api/src/
    - component_id: ui
      name: UI
      paths:
        - apps/ui/src/
    - component_id: shared-contracts
      name: Shared Contracts
      paths:
        - packages/contracts/src/
    - component_id: jobs
      name: Backend Jobs
      paths:
        - packages/jobs/src/
    - component_id: backend
      name: Backend
      paths:
        - packages/backend/src/

comment:
  layout: "diff, flags, components"
  behavior: default
  require_changes: true

github_checks:
  annotations: false

ignore:
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.stories.tsx"
  - "docs/"
