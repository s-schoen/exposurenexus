name: exposurenexus

services:
  app:
    image: exposurenexus:local
    build:
      context: .
    environment:
      APP_ORIGIN: http://localhost:3001
      API_TIMEOUT_MS: "5000"
      AUTH_COOKIE_SECURE: "true"
      AUTH_SECRET: replace-with-a-random-secret-at-least-32-characters
      AUTH_TRUSTED_PROXIES: ""
      DATABASE_URL: postgres://exposurenexus:change-me@postgres:5432/exposurenexus
      LOG_LEVEL: info
    ports:
      - "3001:3001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: exposurenexus
      POSTGRES_USER: exposurenexus
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U exposurenexus -d exposurenexus
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  postgres-data:
