name: exposurenexus

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/s-schoen/exposurenexus:edge}
    command: [/app/apps/api/dist/src/index.js]
    restart: unless-stopped
    stop_grace_period: 75s
    environment:
      APP_ORIGIN: http://localhost:3001
      API_TIMEOUT_MS: "5000"
      AUTH_COOKIE_SECURE: "true"
      AUTH_SECRET: replace-with-a-random-secret-at-least-32-characters
      AUTH_TRUSTED_PROXIES: ""
      DATABASE_URL: postgres://exposurenexus:change-me@postgres:5432/exposurenexus
      RABBITMQ_URL: ${RABBITMQ_API_URL:?Set RABBITMQ_API_URL with publisher credentials}
      RABBITMQ_EXCHANGE: EXPOSURENEXUS_JOBS
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
      S3_REGION: ${S3_REGION:?Set S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://s3:7070}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      IMPORT_SOURCE_MAX_SIZE_BYTES: ${IMPORT_SOURCE_MAX_SIZE_BYTES:-104857600}
      IMPORT_SOURCE_RETENTION_POLICY: ${IMPORT_SOURCE_RETENTION_POLICY:-temporary}
      IMPORT_SOURCE_UPLOAD_TIMEOUT_MS: ${IMPORT_SOURCE_UPLOAD_TIMEOUT_MS:-300000}
      LOG_LEVEL: info
    ports:
      - "3001:3001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
      s3:
        condition: service_healthy
      init-s3:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    image: ${APP_IMAGE:-ghcr.io/s-schoen/exposurenexus:edge}
    command: [/app/apps/worker/dist/src/index.js]
    restart: unless-stopped
    stop_grace_period: 75s
    environment:
      DATABASE_URL: postgres://exposurenexus:change-me@postgres:5432/exposurenexus
      RABBITMQ_URL: ${RABBITMQ_WORKER_URL:?Set RABBITMQ_WORKER_URL with consumer credentials}
      RABBITMQ_QUEUE: EXPOSURENEXUS_JOBS_INGEST
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
      S3_REGION: ${S3_REGION:?Set S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://s3:7070}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      LOG_LEVEL: info
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
      app:
        condition: service_healthy
      s3:
        condition: service_healthy
      init-s3:
        condition: service_completed_successfully

  rabbitmq:
    image: rabbitmq:4.3.5-management
    hostname: rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_PROVISIONER_USER:?Set RABBITMQ_PROVISIONER_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PROVISIONER_PASSWORD:?Set RABBITMQ_PROVISIONER_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: exposurenexus
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_running]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  rabbitmq-init:
    image: alpine:3
    entrypoint: [/bin/sh, -ec]
    command:
      - apk add --no-cache bash curl jq ca-certificates && exec bash /provision/rabbitmq-init.sh
    environment:
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      RABBITMQ_PROVISIONER_USER: ${RABBITMQ_PROVISIONER_USER:?Set RABBITMQ_PROVISIONER_USER}
      RABBITMQ_PROVISIONER_PASSWORD: ${RABBITMQ_PROVISIONER_PASSWORD:?Set RABBITMQ_PROVISIONER_PASSWORD}
      RABBITMQ_API_USER: ${RABBITMQ_API_USER:?Set RABBITMQ_API_USER}
      RABBITMQ_API_PASSWORD: ${RABBITMQ_API_PASSWORD:?Set RABBITMQ_API_PASSWORD}
      RABBITMQ_WORKER_USER: ${RABBITMQ_WORKER_USER:?Set RABBITMQ_WORKER_USER}
      RABBITMQ_WORKER_PASSWORD: ${RABBITMQ_WORKER_PASSWORD:?Set RABBITMQ_WORKER_PASSWORD}
    volumes:
      - ../../scripts/rabbitmq-init.sh:/provision/rabbitmq-init.sh:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    depends_on:
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: exposurenexus
      POSTGRES_USER: exposurenexus
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U exposurenexus -d exposurenexus
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  s3:
    container_name: versitygw
    image: ghcr.io/versity/versitygw:latest
    ports:
      - "127.0.0.1:7070:7070" # S3 API for host development
    environment:
      ROOT_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      ROOT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
      VGW_PORT: ":7070"
      VGW_BACKEND: posix
      VGW_BACKEND_ARGS: /data/s3
      VGW_HEALTH: /health
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7070/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - s3-data:/data/s3
      - s3-versioning:/data/versioning

  init-s3:
    container_name: init-s3
    image: public.ecr.aws/aws-cli/aws-cli:latest
    restart: no
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION:?Set S3_REGION}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if aws \
          --endpoint-url http://s3:7070 \
          s3api head-bucket \
          --bucket "$${S3_BUCKET}" \
          >/dev/null 2>&1
        then
          echo "Bucket '$${S3_BUCKET}' already exists"
        else
          echo "Creating bucket '$${S3_BUCKET}'"

          aws \
            --endpoint-url http://s3:7070 \
            s3api create-bucket \
            --bucket "$${S3_BUCKET}"
          fi
    depends_on:
      s3:
        condition: service_healthy

volumes:
  postgres-data:
  rabbitmq-data:
  s3-data:
  s3-versioning:
